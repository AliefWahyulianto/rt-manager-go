cat > templates/event_edit.html << 'EOF'
{{define "content"}}
<div class="max-w-2xl mx-auto">
    <div class="glass-panel rounded-2xl p-8">
        <h2 class="text-[32px] leading-[40px] font-bold text-[#d6e3ff] mb-2">Edit Event</h2>

        <form method="POST" action="/event/edit/{{.Event.ID}}" class="space-y-5">
            <div>
                <label class="block text-[#c0c7d4] text-sm mb-2">Nama Event</label>
                <input type="text" name="nama_event" value="{{.Event.NamaEvent}}" required class="w-full bg-[#010e24] border border-[#404752]/30 rounded-xl py-3 px-4 text-[#d6e3ff]">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[#c0c7d4] text-sm mb-2">Tanggal</label>
                    <input type="date" name="tanggal" value="{{.Event.Tanggal}}" required class="w-full bg-[#010e24] border border-[#404752]/30 rounded-xl py-3 px-4 text-[#d6e3ff]">
                </div>
                <div>
                    <label class="block text-[#c0c7d4] text-sm mb-2">Lokasi</label>
                    <input type="text" name="lokasi" value="{{.Event.Lokasi}}" required class="w-full bg-[#010e24] border border-[#404752]/30 rounded-xl py-3 px-4 text-[#d6e3ff]">
                </div>
            </div>

            <div>
                <label class="block text-[#c0c7d4] text-sm mb-2">Anggaran (Rp)</label>
                <input type="number" name="anggaran" value="{{.Event.Anggaran}}" class="w-full bg-[#010e24] border border-[#404752]/30 rounded-xl py-3 px-4 text-[#d6e3ff]">
            </div>

            <div>
                <label class="block text-[#c0c7d4] text-sm mb-2">Deskripsi</label>
                <textarea name="deskripsi" rows="4" required class="w-full bg-[#010e24] border border-[#404752]/30 rounded-xl py-3 px-4 text-[#d6e3ff]">{{.Event.Deskripsi}}</textarea>
            </div>

            <div class="flex gap-4 pt-4">
                <button type="submit" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-[#3394f1] to-[#0060a8] text-[#002b50] font-bold">Update Event</button>
                <a href="/event" class="flex-1 py-3 rounded-xl text-center bg-[#1c2a41] text-[#c0c7d4]">Batal</a>
            </div>
        </form>
    </div>
</div>
{{end}}
EOF
