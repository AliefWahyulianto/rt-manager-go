{{define "content"}}
<div class="max-w-2xl mx-auto">
    <div class="glass-panel rounded-2xl p-8">
        <h2 class="text-[32px] leading-[40px] font-bold text-[#d6e3ff] mb-2">Tambah Iuran Warga</h2>
        <p class="text-[#c0c7d4] mb-6">Catat iuran bulanan warga</p>

        <form method="POST" action="/iuran/tambah" class="space-y-5">
            <div>
                <label class="block text-[#c0c7d4] text-sm mb-2">Pilih Warga</label>
                <select name="warga_id" required class="w-full bg-[#010e24] border border-[#404752]/30 rounded-xl py-3 px-4 text-[#d6e3ff]">
                    <option value="">-- Pilih Warga --</option>
                    {{range .WargaList}}
                    <option value="{{.ID}}">{{.Nama}} - {{.Alamat}}</option>
                    {{end}}
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[#c0c7d4] text-sm mb-2">Bulan</label>
                    <select name="bulan" required class="w-full bg-[#010e24] border border-[#404752]/30 rounded-xl py-3 px-4 text-[#d6e3ff]">
                        <option value="Januari">Januari</option>
                        <option value="Februari">Februari</option>
                        <option value="Maret">Maret</option>
                        <option value="April">April</option>
                        <option value="Mei">Mei</option>
                        <option value="Juni">Juni</option>
                        <option value="Juli">Juli</option>
                        <option value="Agustus">Agustus</option>
                        <option value="September">September</option>
                        <option value="Oktober">Oktober</option>
                        <option value="November">November</option>
                        <option value="Desember">Desember</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[#c0c7d4] text-sm mb-2">Tahun</label>
                    <input type="number" name="tahun" value="2026" required class="w-full bg-[#010e24] border border-[#404752]/30 rounded-xl py-3 px-4 text-[#d6e3ff]">
                </div>
            </div>

            <div>
                <label class="block text-[#c0c7d4] text-sm mb-2">Nominal (Rp)</label>
                <input type="number" name="nominal" placeholder="25000" required class="w-full bg-[#010e24] border border-[#404752]/30 rounded-xl py-3 px-4 text-[#d6e3ff]">
            </div>

            <div>
                <label class="block text-[#c0c7d4] text-sm mb-2">Status</label>
                <select name="status" class="w-full bg-[#010e24] border border-[#404752]/30 rounded-xl py-3 px-4 text-[#d6e3ff]">
                    <option value="Belum">Belum Bayar</option>
                    <option value="Lunas">Lunas</option>
                </select>
            </div>

            <div class="flex gap-4 pt-4">
                <button type="submit" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-[#3394f1] to-[#0060a8] text-[#002b50] font-bold">
                    Simpan Iuran
                </button>
                <a href="/iuran" class="flex-1 py-3 rounded-xl text-center bg-[#1c2a41] border border-white/10 text-[#c0c7d4] hover:bg-[#2c3951]">
                    Batal
                </a>
            </div>
        </form>
    </div>
</div>
{{end}}
